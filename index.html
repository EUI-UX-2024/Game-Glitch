<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Game Glitch</title>
</head>
<body>
<section class="home" id="home">
<button class="settings" id="settingsBtn">⚙</button>
<div class="left-images">
<img src="img/rings.gif" class="rings" alt="">
<img src="img/cubes.gif" class="cubes" alt="">
<img src="img/console.gif" class="console" alt="Game Console">
</div>
<div class="content">
<img src="img/small-controller.gif" class="small-controller" alt="Game Controller">
<h1>GAME GLITCH</h1>
<h2><span>Spot the</span> Game UI Mistake</h2>
<p>A visual game to test your ability to<br>
find and fix common UI/UX mistakes in<br>
video game interfaces.</p>
<button class="start-btn" id="startBtn">▶ Start Game</button>
<div class="bottom-buttons">
<button id="howBtn">🎮 How to Play</button>
<button id="leaderBtn">🏆 Leaderboard</button>
</div>
</div>
</section>
<div class="modal" id="nameModal">
<div class="modal-box">
<h3>Enter Your Name</h3>
<form onsubmit="return saveAndGo()">
<input type="text" id="playerName" placeholder="Your name..." maxlength="15">
<p class="error" id="nameError"></p>
<div class="modal-actions">
<button type="submit" id="confirmBtn">Let's Go!</button>
<button type="button" id="cancelBtn">Cancel</button>
</div>
</form>
</div>
</div>
<script>
let startBtn = document.getElementById("startBtn");
let howBtn = document.getElementById("howBtn");
let leaderBtn = document.getElementById("leaderBtn");
let settingsBtn = document.getElementById("settingsBtn");
let nameModal = document.getElementById("nameModal");
let playerName = document.getElementById("playerName");
let nameError = document.getElementById("nameError");
let cancelBtn = document.getElementById("cancelBtn");
let name;
startBtn.onclick = function(){
playerName.value = localStorage.getItem("playerName") || "";
nameError.textContent = "";
nameModal.classList.add("show");
playerName.focus();
};
function save(){
name = playerName.value.trim();
localStorage.setItem("playerName", name);
}
function goToPage(){
window.location = "levels.html";
}
function saveAndGo(){
if (playerName.value.trim() === "") {
nameError.textContent = "Please enter your name!";
return false;
}
save();
goToPage();
return false;
}
cancelBtn.onclick = function(){
nameModal.classList.remove("show");
};
howBtn.onclick = function(){
window.location.href = "howtoplay.html";
};
leaderBtn.onclick = function(){
alert("Leaderboard will be available soon!");
};
settingsBtn.onclick = function(){
alert("Game Glitch Settings");
};
</script>
</body>
</html>
