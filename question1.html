<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Question - Game Glitch</title>
</head>
<body>
<section class="instructions" id="game">
<button class="game-home" id="gameHomeBtn" onclick="goHome()"><span>🏠</span></button>
<div class="instructions-box" id="gameBox">
<img src="img/small-controller.gif" class="how-controller" alt="Game Controller">
<h1 class="how-title q-title">Question <span id="qNum">1</span> / <span id="qTotal">15</span></h1>
<div class="top-pill level-pill"><img src="img/castle-color.png" class="pill-img" alt="">Level 1</div>
<div class="top-pill score-pill"><span class="pill-icon">⭐</span>Score: <span id="score">0</span></div>
<div class="game-content">
<div class="question-bar" id="questionText"></div>
<div class="options" id="imageOptions">
<div class="option" onclick="chooseAnswer('A')">
<div class="shot" id="shotA"></div>
<div class="ab">A</div>
</div>
<div class="option" onclick="chooseAnswer('B')">
<div class="shot" id="shotB"></div>
<div class="ab">B</div>
</div>
</div>
<div class="mistake-wrap" id="mistakeOptions">
<div class="game-screen" id="gameScreen"></div>
<div class="text-options">
<div class="text-opt" onclick="chooseAnswer('A')">
<div class="t-badge">A</div>
<p id="optA"></p>
</div>
<div class="text-opt" onclick="chooseAnswer('B')">
<div class="t-badge">B</div>
<p id="optB"></p>
</div>
</div>
</div>
</div>
</div>
<div class="result-overlay" id="resultOverlay">
<div class="result-box" id="correctBox">
<div class="res-badge">✅</div>
<h2>Correct Answer!</h2>
<div class="points" id="pointsText">+10 Points</div>
<p class="msg">Great job! You spotted the better design. 🎉</p>
<div class="res-buttons">
<button class="res-btn next-btn" onclick="nextQuestion()">Next Question →</button>
</div>
</div>
<div class="result-box wide" id="wrongBox">
<div class="res-badge">❌</div>
<h2>Wrong Answer</h2>
<p class="msg">That's not the best choice this time.</p>
<p class="explain" id="explanationText"></p>
<div class="res-buttons">
<button class="res-btn try-btn" onclick="tryAgain()">🔄 Try Again</button>
<button class="res-btn next-btn" onclick="nextQuestion()">Next Question →</button>
</div>
</div>
</div>
<div class="final-screen" id="finalScreen">
<div class="final-box">
<img src="img/trophy.png" class="final-trophy" alt="">
<h2 class="final-title">Game Complete!</h2>
<div class="final-stats">
<div class="stat"><span class="stat-icon">🎯</span><div><small>Correct</small><b id="fCorrect">0</b></div></div>
<div class="stat"><span class="stat-icon">❌</span><div><small>Incorrect</small><b id="fWrong">0</b></div></div>
<div class="stat"><span class="stat-icon">⭐</span><div><small>Final Score</small><b id="fScore">0</b></div></div>
<div class="stat"><div class="ring" id="fRing"><span id="fPercent">0%</span></div></div>
</div>
<div class="final-msg">
<h3 id="fTitle"></h3>
<p id="fText"></p>
</div>
<button class="res-btn next-btn final-btn" onclick="nextLevel()">Next Level →</button>
</div>
</div>
</section>
<script>
let questions = [
{
type: "images",
text: "Which health bar is easier to read during gameplay?",
shotClass: "shot",
a: `
<div class="hud">
<div class="hero"><img src="img/hero.png" alt=""><span class="lv">Lv. 5</span></div>
<div class="hp-good"><span>❤</span><b>100 / 100</b></div>
</div>`,
b: `
<div class="hud">
<div class="hero"><img src="img/hero.png" alt=""><span class="lv">Lv. 5</span></div>
<div class="hp-bad"><i></i><b>100/100</b></div>
</div>`,
correct: "A",
explanation: "Option A has a bigger bar, a clear heart icon and high-contrast text, so players can read their health at a glance."
},
{
type: "images",
text: "Which button design is more visible and easier to click?",
shotClass: "shot purple",
a: `
<div class="btn-col">
<div class="dbtn">Play</div>
<div class="dbtn">Settings</div>
<div class="dbtn">Quit</div>
</div>`,
b: `
<div class="btn-col">
<div class="ybtn"><span>▶</span>Play</div>
<div class="ybtn"><span>⚙</span>Settings</div>
<div class="ybtn"><span>⏻</span>Quit</div>
</div>`,
correct: "B",
explanation: "Option B uses bright, high-contrast buttons with clear icons, so players can see them and click them easily."
},
{
type: "images",
text: "Which icon is more clear and easier to understand?",
shotClass: "shot light",
a: `<img src="img/home-dull.png" class="icon-img" alt="">`,
b: `<img src="img/home-clear.png" class="icon-img" alt="">`,
correct: "B",
explanation: "Option B is a simple, high-contrast home icon. Option A is dull and the plus sign makes it look like a hospital."
},
{
type: "images",
text: "Which button is more suitable for starting the game?",
shotClass: "shot purple",
a: `<div class="dbtn start-wide"><span>▶</span>Start</div>`,
b: `<div class="ybtn start-wide"><span>▶</span>Start Game</div>`,
correct: "B",
explanation: "Option B is bright and clearly labeled 'Start Game'. Option A looks gray, like a disabled button."
},
{
type: "images",
text: "Which icon is more suitable for a Pause menu?",
shotClass: "shot purple",
a: `<div class="icon-btn"><i class="bar"></i><i class="bar"></i></div>`,
b: `<div class="icon-btn"><span class="tri"></span></div>`,
correct: "A",
explanation: "The two vertical bars are the universal Pause symbol. The triangle means Play, so it would confuse players."
},
{
type: "images",
text: "Which icon is more suitable for Settings?",
shotClass: "shot purple",
a: `<div class="big-icon">⚙</div>`,
b: `<div class="big-icon">🔧</div>`,
correct: "A",
explanation: "The gear is the standard Settings icon. The wrench looks like a repair or tools menu."
},
{
type: "mistake",
text: "What's the UI mistake in this game screen?",
screen: `
<div class="gs-hud">
<div class="gs-hero">
<img src="img/hero.png" alt="">
<div class="gs-info">
<b>Lv. 5</b>
<div class="gs-xp"><i></i><span>XP: 120 / 500</span></div>
</div>
</div>
<div class="gs-money">
<div class="gs-chip">🪙 250</div>
<div class="gs-chip">💎 10</div>
</div>
</div>
<img src="img/knight.png" class="gs-knight" alt="">
<img src="img/sign.png" class="gs-sign" alt="">`,
optionA: "The “Next” button points in the wrong direction",
optionB: "The level number is missing",
correct: "A",
explanation: "A “Next” sign should point forward (to the right). An arrow pointing left suggests going back, which confuses players."
},
{
type: "images",
text: "Which background is more suitable for the Home screen?",
shotClass: "shot photo",
a: `<img src="img/home-bg-good.png" class="fill-img" alt="">`,
b: `<img src="img/cave.png" class="fill-img" alt="">`,
correct: "A",
explanation: "Option A is bright and welcoming, with a clear castle in the distance. Option B is dark and gloomy, which is not a good first impression for a Home screen."
},
{
type: "images",
text: "Which HUD (in-game interface) is clearer and easier to read?",
shotClass: "shot photo",
a: `
<div class="hud-scene">
<img src="img/home-bg-good.png" class="hs-bg" alt="">
<img src="img/warrior.png" class="hs-char" alt="">
<img src="img/hero.png" class="hs-hero" alt="">
<div class="hs-bars"><b>Lv. 5</b><i></i><i class="b"></i><i class="y"></i></div>
<div class="hs-mini"></div>
<div class="hs-potions"><i></i><i></i><i></i><i></i></div>
<img src="img/skills.png" class="hs-skills" alt="">
</div>`,
b: `
<div class="hud-scene">
<img src="img/home-bg-good.png" class="hs-bg" alt="">
<img src="img/warrior.png" class="hs-char" alt="">
<img src="img/hero.png" class="hs-hero" alt="">
<div class="hs-bars"><b>Lv. 5</b><i></i></div>
<div class="hs-money"><span class="gs-chip">🪙 250</span><span class="gs-chip">💎 10</span></div>
<div class="hs-stick"><i></i></div>
<div class="hs-attack">⚔</div>
</div>`,
correct: "B",
explanation: "Option B shows only the essential information with plenty of space around the character. Option A is overcrowded with too many icons and bars, so players cannot focus."
},
{
type: "images",
text: "Which button is more common for starting the game?",
shotClass: "shot purple",
a: `<div class="play-green"><i></i></div>`,
b: `<div class="x-btn">✕</div>`,
correct: "A",
explanation: "A green Play button is the common symbol for starting. The red X usually means close or cancel, so it would confuse players."
},
{
type: "images",
text: "Which icon is more suitable for representing the inventory?",
shotClass: "shot purple",
a: `<img src="img/backpack.png" class="icon-img" alt="">`,
b: `<img src="img/chest.png" class="icon-img" alt="">`,
correct: "A",
explanation: "A backpack is the familiar symbol for the items you carry. A treasure chest suggests rewards or loot, not your inventory."
},
{
type: "images",
text: "Which item is used to save your progress in the game?",
shotClass: "shot purple",
a: `<div class="big-icon">💾</div>`,
b: `<div class="big-icon">⚙</div>`,
correct: "A",
explanation: "The floppy disk is the classic Save icon. The gear means Settings."
},
{
type: "images",
text: "Which game objective is clearer and easier to follow?",
shotClass: "shot photo",
a: `
<div class="hud-scene">
<img src="img/wall.png" class="hs-bg" alt="">
<div class="obj-good">
<div class="obj-tag">Objective</div>
<div class="obj-body"><span class="obj-icon">📜</span><p>Find the <em>Key</em><br>and open the <em>Gate</em>.</p></div>
</div>
</div>`,
b: `
<div class="hud-scene">
<img src="img/wall.png" class="hs-bg" alt="">
<div class="obj-bad"><span>📜</span><div><b>Objective</b><i>???</i></div></div>
</div>`,
correct: "A",
explanation: "Option A tells the player exactly what to do with a clear title and a short instruction. Option B only shows question marks, so the player has no idea what the goal is."
},
{
type: "images",
text: "Which game interface has a clearer Action button?",
shotClass: "shot purple",
a: `
<div class="act-scene">
<img src="img/open-chest.png" class="act-chest" alt="">
<div class="act-col">
<div class="act-collect"><i></i>Collect</div>
<div class="act-cancel">Cancel</div>
</div>
</div>`,
b: `
<div class="act-scene">
<img src="img/open-chest.png" class="act-chest" alt="">
<div class="act-icons">
<div class="act-ic top">✕</div>
<div class="act-row"><div class="act-ic">⬇</div><div class="act-ic">»</div></div>
</div>
</div>`,
correct: "A",
explanation: "Option A uses a big green button with a clear 'Collect' label and a smaller Cancel button. Option B shows unlabeled gray icons, so players cannot tell what each one does."
},
{
type: "images",
text: "Which design gives clear feedback after collecting the item?",
shotClass: "shot night",
a: `
<div class="fb-scene">
<div class="fb-rays"></div>
<img src="img/coin.png" class="fb-coin" alt="">
<div class="fb-ribbon">Item Collected!</div>
<div class="fb-plus"><img src="img/coin.png" alt="">+10 Coins</div>
</div>`,
b: `
<div class="fb-scene">
<div class="fb-rays dim"></div>
<img src="img/coin.png" class="fb-coin" alt="">
</div>`,
correct: "A",
explanation: "Option A confirms the action with a clear message and shows the reward. Option B shows only a coin, so the player does not know if anything happened."
}
];

let score = 0;
let correctCount = 0;
let wrongCount = 0;
let current = 0;
let answered = false;
let missed = false;

document.getElementById("qTotal").innerHTML = questions.length;

function loadQuestion(){
let q = questions[current];
document.getElementById("qNum").innerHTML = current + 1;
document.getElementById("questionText").innerHTML = q.text;
missed = false;
if(q.type == "mistake"){
document.getElementById("imageOptions").style.display = "none";
document.getElementById("mistakeOptions").style.display = "block";
document.getElementById("gameScreen").innerHTML = q.screen;
document.getElementById("optA").innerHTML = q.optionA;
document.getElementById("optB").innerHTML = q.optionB;
}else{
document.getElementById("mistakeOptions").style.display = "none";
document.getElementById("imageOptions").style.display = "flex";
document.getElementById("shotA").className = q.shotClass;
document.getElementById("shotB").className = q.shotClass;
document.getElementById("shotA").innerHTML = q.a;
document.getElementById("shotB").innerHTML = q.b;
}
}

function closeResult(){
document.getElementById("resultOverlay").style.display = "none";
document.getElementById("correctBox").style.display = "none";
document.getElementById("wrongBox").style.display = "none";
}

function chooseAnswer(choice){
if(answered == true){
return;
}
answered = true;
let q = questions[current];
document.getElementById("resultOverlay").style.display = "flex";
if(choice == q.correct){
if(missed == false){
score = score + 10;
correctCount = correctCount + 1;
document.getElementById("pointsText").innerHTML = "+10 Points";
}else{
document.getElementById("pointsText").innerHTML = "+0 Points";
}
document.getElementById("score").innerHTML = score;
document.getElementById("correctBox").style.display = "block";
}else{
if(missed == false){
missed = true;
wrongCount = wrongCount + 1;
}
document.getElementById("explanationText").innerHTML = q.explanation;
document.getElementById("wrongBox").style.display = "block";
}
}

function tryAgain(){
closeResult();
answered = false;
}

function saveScore(){
let name = localStorage.getItem("playerName") || "Player";
let scores = JSON.parse(localStorage.getItem("scores")) || [];
scores.push({ name: name, score: score, correct: correctCount, total: questions.length, level: 1 });
scores.sort(function(a, b){ return b.score - a.score; });
localStorage.setItem("scores", JSON.stringify(scores.slice(0, 10)));
}

function showFinal(){
let total = questions.length;
let percent = Math.round((correctCount / total) * 100);
document.getElementById("fCorrect").innerHTML = correctCount;
document.getElementById("fWrong").innerHTML = total - correctCount;
document.getElementById("fScore").innerHTML = score + " / " + (total * 10);
document.getElementById("fPercent").innerHTML = percent + "%";
document.getElementById("fRing").style.background = "conic-gradient(#7a3fc0 " + percent + "%, #e4d4fc 0)";
if(percent >= 80){
document.getElementById("fTitle").innerHTML = "👑 Great Job! 👑";
document.getElementById("fText").innerHTML = "You completed the level with a strong performance! Your UX/UI skills are really improving!";
}else if(percent >= 50){
document.getElementById("fTitle").innerHTML = "Good Work!";
document.getElementById("fText").innerHTML = "You spotted many of the mistakes. Keep practicing to get even better!";
}else{
document.getElementById("fTitle").innerHTML = "Keep Trying!";
document.getElementById("fText").innerHTML = "UI mistakes can be tricky. Read the explanations and try the next level!";
}
document.getElementById("gameBox").style.display = "none";
document.getElementById("finalScreen").style.display = "flex";
}
function nextQuestion(){
closeResult();
answered = false;
current = current + 1;
if(current >= questions.length){
saveScore();
showFinal();
}else{
loadQuestion();
}
}
function nextLevel(){
localStorage.setItem("unlockedLevel", "2");
window.location.href = "levels.html";
}
function goHome(){
window.location.href = "index.html";
}
loadQuestion();
</script>
</body>
</html>
